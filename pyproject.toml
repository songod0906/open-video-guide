[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "open-video-guide"
version = "0.0.1"
description = "Local-first contracts for evidence-grounded tutorial guides"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Son Hoang Nguyen" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed"
]
dependencies = [
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
local-ai = [
  "faster-whisper>=1.2,<2",
  "mlx-vlm>=0.6.8,<0.7",
  "Pillow>=11,<13",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1"
]
mcp = [
  "mcp>=1.29,<3"
]
web = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1"
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1"
]

[project.scripts]
ovg = "open_video_guide.cli:main"
ovg-mcp = "open_video_guide.adapters.mcp_server:main"
ovg-web = "open_video_guide.adapters.web_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_video_guide"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/guide.schema.json" = "open_video_guide/schemas/guide.schema.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
