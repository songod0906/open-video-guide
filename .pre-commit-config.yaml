repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ste
        name: Limited ASD-STE100 check
        entry: python scripts/check_ste.py
        language: system
        pass_filenames: false
      - id: tests
        name: Unit tests
        entry: python -m pytest
        language: system
        pass_filenames: false
